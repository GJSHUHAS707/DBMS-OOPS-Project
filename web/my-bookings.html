<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>My Tickets — CINEPHILE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-content">
      <a href="/index.html" class="brand-mark">
        <span class="brand-word">Cinephile</span>
      </a>
      <div id="nav-actions" class="nav-actions"></div>
    </div>
  </header>

  <main class="container page-shell">
    <div class="section-head">
      <div>
        <h1 id="bookings-heading" class="section-title">My Tickets</h1>
      </div>
      <a href="/index.html" class="btn btn-primary btn-sm">+ Book Tickets</a>
    </div>

    <div tabindex="0" role="region" aria-labelledby="bookings-heading" class="table-wrapper">
      <table class="data-table">
        <caption style="position:absolute; left:-9999px;">My Ticket History</caption>
        <thead>
          <tr>
            <th>Ref</th>
            <th>Movie</th>
            <th>Theatre &amp; Screen</th>
            <th>Showtime</th>
            <th>Seats</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookings-tbody">
          <tr><td colspan="8" style="color:var(--stone);">Loading tickets...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <dialog id="cancel-dialog" closedby="any" aria-labelledby="cancel-dlg-title">
    <div class="dialog-header">
      <h1 id="cancel-dlg-title">Cancel Ticket?</h1>
    </div>
    <p id="cancel-dlg-msg" style="color:var(--stone); margin-block-end:1.25rem;"></p>
    <div style="display:flex; justify-content:flex-end; gap:0.65rem;">
      <button type="button" class="btn btn-sm" id="btn-keep" autofocus>Keep Ticket</button>
      <button type="button" class="btn btn-danger btn-sm" id="btn-confirm-cancel">Yes, Cancel Ticket</button>
    </div>
  </dialog>

  <footer>
    <div class="container">&copy; 2026 CINEPHILE</div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    let pendingCancelId = null;

    async function loadMyBookings() {
      const session = getSession();
      if (!session) {
        window.location.href = '/login.html?redirect=/my-bookings.html';
        return;
      }
      const tbody = document.getElementById('bookings-tbody');
      try {
        const res = await apiRequest('/api/bookings/my');
        const list = res.data;
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="8" style="color:var(--stone);">No tickets yet. Browse movies to book seats.</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(b => {
          const isConf = b.bookingStatus === 'CONFIRMED';
          return `
            <tr>
              <th data-label="Ref" style="font-family:var(--font-mono); color:var(--gold);">${esc(b.bookingRef)}</th>
              <td data-label="Movie"><b>${esc(b.movieTitle)}</b></td>
              <td data-label="Theatre">${esc(b.theatreName)} (${esc(b.screenName)})</td>
              <td data-label="Showtime">${esc(formatTime12(b.showTime))} &bull; ${esc(formatDateFriendly(b.showDate))}</td>
              <td data-label="Seats">${esc((b.seats || []).join(', '))}</td>
              <td data-label="Amount">Rs.${Number(b.totalAmount).toFixed(2)} (${esc(b.paymentMethod)})</td>
              <td data-label="Status"><span class="chip ${isConf ? 'green' : 'red'}">${esc(b.bookingStatus)}</span></td>
              <td data-label="Actions" style="display:flex; gap:0.45rem; flex-wrap:wrap;">
                <button type="button" class="btn btn-sm" onclick="downloadTicket(${b.bookingId}, '${esc(b.bookingRef)}')">Ticket .txt</button>
                ${isConf ? `<button type="button" class="btn btn-danger btn-sm" onclick="promptCancel(${b.bookingId}, '${esc(b.bookingRef)}')">Cancel</button>` : ''}
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function downloadTicket(bookingId, ref) {
      const session = getSession();
      const r = await fetch(`/api/bookings/${bookingId}/ticket`, {
        headers: { Authorization: `Bearer ${session.token}` }
      });
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Ticket_${ref}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function promptCancel(id, ref) {
      pendingCancelId = id;
      document.getElementById('cancel-dlg-msg').textContent =
        `Cancelling ${ref} will release your reserved seats immediately.`;
      document.getElementById('cancel-dialog').showModal();
    }

    document.getElementById('btn-keep').addEventListener('click', () => {
      document.getElementById('cancel-dialog').close();
    });

    document.getElementById('btn-confirm-cancel').addEventListener('click', async () => {
      if (!pendingCancelId) return;
      try {
        await apiRequest(`/api/bookings/${pendingCancelId}/cancel`, { method: 'POST' });
        showToast('Ticket cancelled and seats released');
        document.getElementById('cancel-dialog').close();
        loadMyBookings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    loadMyBookings();
  </script>
</body>
</html>
